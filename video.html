<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 مولّد فيديو — ملعب بالساعة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Arial, "Segoe UI", sans-serif;
    background: #0a0614;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  h1 {
    font-size: 22px;
    color: #00dcff;
    text-align: center;
    text-shadow: 0 0 20px #9b59ff;
  }
  .panel {
    background: #150a28;
    border: 1px solid #9b59ff;
    border-radius: 10px;
    padding: 12px;
    width: 100%;
    max-width: 480px;
  }
  canvas {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 9/16;
    border: 2px solid #9b59ff;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(155, 89, 255, 0.5);
    background: #000;
    display: block;
    margin: 0 auto;
  }
  video {
    width: 100%;
    max-width: 320px;
    border-radius: 12px;
    border: 2px solid #32ff82;
    display: none;
    margin: 0 auto;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 12px;
  }
  button {
    font-family: inherit;
    font-weight: bold;
    font-size: 15px;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.2s;
  }
  button:hover:not(:disabled) { transform: scale(1.05); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btnStart { background: linear-gradient(135deg, #9b59ff, #00dcff); }
  #btnDiag  { background: #444; font-size: 13px; padding: 8px 14px; }
  #btnDownload { background: linear-gradient(135deg, #32ff82, #00dcff); display: none; }
  #status {
    font-size: 14px;
    color: #c0b0e0;
    text-align: center;
    min-height: 24px;
    padding: 8px;
    line-height: 1.6;
  }
  #diag {
    display: none;
    font-family: monospace;
    font-size: 12px;
    background: #000;
    color: #32ff82;
    padding: 10px;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow: auto;
    direction: ltr;
    text-align: left;
  }
  .info {
    font-size: 12px;
    color: #8070a0;
    text-align: center;
    line-height: 1.8;
    max-width: 480px;
  }
  .error {
    color: #ff3c50 !important;
    background: rgba(255,60,80,0.1);
    border-radius: 6px;
  }
</style>
</head>
<body>

<h1>🎬 مولّد فيديو «ملعب بالساعة»</h1>

<div class="panel">
  <canvas id="canvas" width="1080" height="1920"></canvas>
  <video id="preview" controls playsinline></video>
</div>

<div class="buttons">
  <button id="btnStart">▶️ توليد الفيديو</button>
  <button id="btnDownload">⬇️ تحميل</button>
  <button id="btnDiag">🩺 فحص المتصفح</button>
</div>

<div id="status">جاهز</div>
<div id="diag"></div>

<div class="info">
  ⏱️ 35 ثانية | 📱 1080×1920 عمودي للإنستقرام<br>
  💡 اترك التبويب مفتوحاً أثناء التوليد
</div>

<script>
"use strict";

// ============================================================
// 🎬 الإعدادات
// ============================================================
const W = 1080, H = 1920;
const SCENE_DURATION = 5;
const FPS = 30;

const C = {
  bgTop:    '#080614',
  bgBottom: '#190a32',
  purple:   '#9b59ff',
  cyan:     '#00dcff',
  green:    '#32ff82',
  red:      '#ff3c50',
  white:    '#ffffff',
  yellow:   '#ffdc50',
  orange:   '#ff9632',
};

// خطوط النظام (تعمل دائماً بدون إنترنت)
const FONT_STACK = 'Tahoma, Arial, "Segoe UI", "Noto Sans Arabic", sans-serif';

const SCENES = [
  { type: 'hook',      text: 'عندك ملعب بالساعة؟' },
  { type: 'problem',   text: 'مجموعتين بنفس الوقت!' },
  { type: 'loss',      text: 'كل يوم زبون يهرب' },
  { type: 'solution',  text: 'الحل: موقع + قاعدة بيانات' },
  { type: 'shield',    text: 'كاشف التضارب يمنع الخطأ' },
  { type: 'analytics', text: 'تحليل + صافي الربح + تخزين' },
  { type: 'cta',       text: 'وداعاً للتضارب | ابدأ الآن' },
];

// ============================================================
// 🖼️ عناصر الصفحة
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const preview = document.getElementById('preview');
const btnStart = document.getElementById('btnStart');
const btnDownload = document.getElementById('btnDownload');
const btnDiag = document.getElementById('btnDiag');
const statusEl = document.getElementById('status');
const diagEl = document.getElementById('diag');

let bgGradient = null;

// ============================================================
// 🛠️ أدوات
// ============================================================
function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

function easeOut(x) { return 1 - Math.pow(1 - x, 3); }

function makeBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bgTop);
  g.addColorStop(1, C.bgBottom);
  return g;
}

function drawNeonText(text, x, y, size, color, glow = 20) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT_STACK}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = glow * 2;
  ctx.globalAlpha = 0.5;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawTitle(text, color, t, y = 380, size = 100) {
  let offX = 0;
  if (t < 0.6) offX = (0.6 - t) * 15 * (Math.random() > 0.5 ? 1 : -1);
  const glow = 20 + 12 * Math.sin(t * 4);
  drawNeonText(text, W / 2 + offX, y, size, color, glow);
}

function drawProgressBar(p, color) {
  const x = 100, y = H - 200, w = W - 200, h = 20;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = color;
  const fw = Math.max(0, (w - 6) * p);
  if (fw > 0) ctx.fillRect(x + 3, y + 3, fw, h - 6);
  ctx.restore();
}

function drawFootball(cx, cy, r, color, lw = 5) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72) * Math.PI / 180;
    const px = cx + r * 0.42 * Math.cos(a);
    const py = cy + r * 0.42 * Math.sin(a);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72 + 36) * Math.PI / 180;
    const px = cx + r * 0.78 * Math.cos(a);
    const py = cy + r * 0.78 * Math.sin(a);
    ctx.beginPath();
    for (let j = 0; j < 5; j++) {
      const aa = (-90 + j * 72) * Math.PI / 180;
      const qx = px + r * 0.18 * Math.cos(aa);
      const qy = py + r * 0.18 * Math.sin(aa);
      j === 0 ? ctx.moveTo(qx, qy) : ctx.lineTo(qx, qy);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
}

function drawShield(cx, cy, w, h, color, lw = 8) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.shadowColor = color;
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(cx - w, cy - h);
  ctx.lineTo(cx + w, cy - h);
  ctx.lineTo(cx + w, cy + h * 0.3);
  ctx.lineTo(cx, cy + h);
  ctx.lineTo(cx - w, cy + h * 0.3);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawCalendar(x, y, w, h, color, lw = 6) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.strokeRect(x, y, w, h);
  ctx.beginPath();
  ctx.moveTo(x, y + h * 0.25);
  ctx.lineTo(x + w, y + h * 0.25);
  ctx.moveTo(x + w * 0.25, y - 15);
  ctx.lineTo(x + w * 0.25, y + 10);
  ctx.moveTo(x + w * 0.75, y - 15);
  ctx.lineTo(x + w * 0.75, y + 10);
  ctx.stroke();
  ctx.restore();
}

function drawCross(cx, cy, s, color, lw = 14) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - s);
  ctx.lineTo(cx + s, cy + s);
  ctx.moveTo(cx - s, cy + s);
  ctx.lineTo(cx + s, cy - s);
  ctx.stroke();
  ctx.restore();
}

function drawCheck(cx, cy, s, color, lw = 14) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(cx - s, cy);
  ctx.lineTo(cx - s * 0.2, cy + s * 0.8);
  ctx.lineTo(cx + s, cy - s * 0.7);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
// 🎬 المشاهد
// ============================================================
function sceneHook(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[0].text, C.cyan, t, 380, 110);
  const cx = W / 2, cy = H / 2 + 250;
  const scale = easeOut(Math.min(1, p * 2));
  const r = 220 * scale;
  if (r > 5) {
    drawFootball(cx, cy, r, C.white, 5);
    for (let i = 0; i < 3; i++) {
      const gr = r + 20 + i * 18 + Math.sin(t * 4 + i) * 8;
      ctx.save();
      ctx.strokeStyle = C.purple;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 - i * 0.15;
      ctx.beginPath();
      ctx.arc(cx, cy, gr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  drawProgressBar(p, C.cyan);
}

function sceneProblem(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[1].text, C.red, t, 380, 110);

  const cw = 700, ch = 700;
  const cx0 = (W - cw) / 2;
  const cy0 = H / 2 - 50;
  drawCalendar(cx0, cy0, cw, ch, C.white, 6);

  const cols = 4, rows = 4;
  const cellW = cw / cols;
  const cellH = (ch * 0.75) / rows;
  const gridY0 = cy0 + ch * 0.25;

  ctx.save();
  ctx.strokeStyle = 'rgba(120,120,180,0.6)';
  ctx.lineWidth = 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.strokeRect(cx0 + c * cellW, gridY0 + r * cellH, cellW, cellH);
    }
  }
  ctx.restore();

  const x1 = cx0 + 2 * cellW;
  const y1 = gridY0 + 1 * cellH;
  const flash = 0.5 + 0.5 * Math.sin(t * 10);
  ctx.save();
  ctx.fillStyle = `rgba(255,60,80,${flash * 0.7})`;
  ctx.shadowColor = C.red;
  ctx.shadowBlur = 25;
  ctx.fillRect(x1, y1, cellW, cellH);
  ctx.restore();

  if (p > 0.3) {
    const s = 120 * easeOut(Math.min(1, (p - 0.3) * 3));
    drawCross(x1 + cellW / 2, y1 + cellH / 2, s, C.red, 14);
  }
  drawProgressBar(p, C.red);
}

function sceneLoss(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[2].text, C.orange, t, 380, 110);

  for (let i = 0; i < 12; i++) {
    const seed = ((i * 9301 + 49297) % 233280) / 233280;
    const baseX = W / 2 + (seed - 0.5) * 600;
    const baseY = H / 2 + 100 + i * 40;
    const fly = p * 600;
    const x = baseX + Math.sin(t * 3 + i) * 40;
    const y = baseY - fly + (i % 3) * 30;
    if (y > 100) {
      ctx.save();
      ctx.strokeStyle = C.yellow;
      ctx.lineWidth = 4;
      ctx.shadowColor = C.yellow;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = C.yellow;
      ctx.font = `bold 50px ${FONT_STACK}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', x, y);
      ctx.restore();
    }
  }

  const ax0 = W / 2 - 300;
  const ay0 = H / 2 + 400;
  ctx.save();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 4;
  ctx.shadowColor = C.red;
  ctx.shadowBlur = 15;
  for (let i = 0; i < 5; i++) {
    const x = ax0 + i * 140;
    const hh = 260 - i * 55;
    ctx.strokeRect(x, ay0 - hh, 100, hh);
  }
  ctx.restore();
  drawProgressBar(p, C.orange);
}

function sceneSolution(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[3].text, C.green, t, 380, 95);

  const devices = [
    { x: W / 2, y: H / 2 + 150, w: 400, h: 260, laptop: true },
    { x: W / 2 - 400, y: H / 2 + 300, w: 160, h: 300 },
    { x: W / 2 + 400, y: H / 2 + 280, w: 220, h: 320 },
  ];

  ctx.save();
  ctx.strokeStyle = C.cyan;
  ctx.lineWidth = 5;
  ctx.shadowColor = C.cyan;
  ctx.shadowBlur = 20;
  devices.forEach(d => {
    ctx.strokeRect(d.x - d.w / 2, d.y - d.h / 2, d.w, d.h);
    if (d.laptop) ctx.strokeRect(d.x - d.w / 2 - 30, d.y + d.h / 2, d.w + 60, 30);
  });
  ctx.restore();

  const dbCx = W / 2, dbCy = H - 500;
  const pulse = 1 + 0.08 * Math.sin(t * 5);
  const s = 130 * pulse;
  ctx.save();
  ctx.strokeStyle = C.green;
  ctx.lineWidth = 6;
  ctx.shadowColor = C.green;
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(dbCx, dbCy - s);
  ctx.lineTo(dbCx + s, dbCy - s / 2);
  ctx.lineTo(dbCx + s, dbCy + s / 2);
  ctx.lineTo(dbCx, dbCy + s);
  ctx.lineTo(dbCx - s, dbCy + s / 2);
  ctx.lineTo(dbCx - s, dbCy - s / 2);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = C.purple;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7;
  devices.forEach(d => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(dbCx, dbCy);
    ctx.stroke();
  });
  ctx.restore();

  drawProgressBar(p, C.green);
}

function sceneShield(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[4].text, C.cyan, t, 380, 100);

  const cx = W / 2, cy = H / 2 + 100;
  const pulse = 1 + 0.05 * Math.sin(t * 6);
  drawShield(cx, cy, 240 * pulse, 280 * pulse, C.cyan, 8);

  if (p > 0.3) {
    const s = 90 * easeOut(Math.min(1, (p - 0.3) * 3));
    drawCheck(cx, cy, s, C.green, 14);
  }

  if (p > 0.5) {
    const bx = W / 2 - 400, by = H - 500, bw = 350, bh = 120;
    const flash = 0.5 + 0.5 * Math.sin(t * 12);
    ctx.save();
    ctx.strokeStyle = `rgba(255,60,80,${flash})`;
    ctx.lineWidth = 5;
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 25;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = C.red;
    ctx.font = `bold 60px ${FONT_STACK}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('تضارب!', bx + bw / 2, by + bh / 2);
    ctx.restore();
  }
  drawProgressBar(p, C.cyan);
}

function sceneAnalytics(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[5].text, C.green, t, 380, 85);

  const baseX = W / 2 - 350;
  const baseY = H / 2 + 300;
  const bars = [80, 140, 220, 300, 400, 520];

  ctx.save();
  ctx.shadowColor = C.green;
  ctx.shadowBlur = 15;
  bars.forEach((h, i) => {
    const prog = easeOut(Math.max(0, Math.min(1, (p - i * 0.05) * 3)));
    const x = baseX + i * 120;
    const barH = h * prog;
    ctx.strokeStyle = C.green;
    ctx.lineWidth = 4;
    ctx.strokeRect(x, baseY - barH, 90, barH);
    if (barH > 4) {
      ctx.fillStyle = C.green;
      ctx.fillRect(x + 3, baseY - barH + 3, 84, barH - 6);
    }
  });
  ctx.restore();

  if (p > 0.4) {
    const iconsY = H - 750;
    ctx.save();
    ctx.fillStyle = C.yellow;
    ctx.shadowColor = C.yellow;
    ctx.shadowBlur = 15;
    ctx.font = `bold 50px ${FONT_STACK}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ['كهرباء', 'ماء', 'تصليحات'].forEach((lbl, i) => {
      ctx.fillText(lbl, 200 + i * 300, iconsY);
    });
    ctx.restore();
  }

  if (p > 0.6) {
    const ry = H - 500;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 20;

    ctx.fillStyle = C.white;
    ctx.shadowColor = C.white;
    ctx.font = `bold 60px ${FONT_STACK}`;
    ctx.fillText('صافي الربح', W / 2, ry);

    ctx.fillStyle = C.green;
    ctx.shadowColor = C.green;
    ctx.font = `bold 90px ${FONT_STACK}`;
    ctx.fillText('+ 850,000 ل.س', W / 2, ry + 120);
    ctx.restore();
  }
  drawProgressBar(p, C.green);
}

function sceneCTA(t, dur) {
  const p = t / dur;
  drawTitle(SCENES[6].text, C.purple, t, 400, 100);

  const cx = W / 2, cy = H / 2 + 150;
  const pulse = 1 + 0.1 * Math.sin(t * 5);
  const r = 220 * pulse;
  drawFootball(cx, cy, r, C.cyan, 6);

  if (p > 0.3) {
    const s = 120 * easeOut(Math.min(1, (p - 0.3) * 3));
    drawCheck(cx, cy, s, C.green, 16);
  }

  ctx.save();
  ctx.fillStyle = C.purple;
  ctx.shadowColor = C.purple;
  ctx.shadowBlur = 15;
  for (let i = 0; i < 30; i++) {
    const ang = i * 12 + t * 60;
    const rad = r + 80 + (i % 5) * 20;
    const px = cx + Math.cos(ang * Math.PI / 180) * rad;
    const py = cy + Math.sin(ang * Math.PI / 180) * rad;
    const pr = 3 + (i % 3);
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (p > 0.5) {
    const bw = 600, bh = 130;
    const bx = W / 2 - bw / 2;
    const by = H - 450;
    ctx.save();
    ctx.strokeStyle = C.green;
    ctx.lineWidth = 6;
    ctx.shadowColor = C.green;
    ctx.shadowBlur = 25;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = C.white;
    ctx.font = `bold 70px ${FONT_STACK}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('تابعنا الآن', W / 2, by + bh / 2);
    ctx.restore();
  }
  drawProgressBar(p, C.purple);
}

const SCENE_FUNCS = {
  hook: sceneHook, problem: sceneProblem, loss: sceneLoss,
  solution: sceneSolution, shield: sceneShield,
  analytics: sceneAnalytics, cta: sceneCTA,
};

// ============================================================
// 🎨 رسم إطار
// ============================================================
function renderFrame(sceneIdx, t, dur) {
  if (!bgGradient) bgGradient = makeBg();
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);

  const scene = SCENES[sceneIdx];
  if (!scene) return;
  SCENE_FUNCS[scene.type](t, dur);
}

// ============================================================
// 🩺 فحص المتصفح
// ============================================================
function runDiagnostics() {
  const lines = [];
  lines.push('=== تشخيص المتصفح ===');
  lines.push('User Agent: ' + navigator.userAgent.slice(0, 80));
  lines.push('');

  lines.push('✓ Canvas 2D: ' + (ctx ? 'مدعوم' : 'غير مدعوم'));
  lines.push('✓ captureStream: ' + (typeof canvas.captureStream === 'function' ? 'مدعوم' : '❌ غير مدعوم'));
  lines.push('✓ MediaRecorder: ' + (typeof MediaRecorder !== 'undefined' ? 'مدعوم' : '❌ غير مدعوم'));
  lines.push('');

  if (typeof MediaRecorder !== 'undefined') {
    lines.push('Codecs المدعومة:');
    const codecs = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4',
    ];
    codecs.forEach(c => {
      lines.push('  - ' + c + ': ' + (MediaRecorder.isTypeSupported(c) ? '✓' : '✗'));
    });
  }

  lines.push('');
  lines.push('صيغة الصوت المُختارة:');
  lines.push('  (سنستخدم أفضل codec متاح)');

  diagEl.textContent = lines.join('\n');
  diagEl.style.display = 'block';
}

// ============================================================
// 🎥 التسجيل
// ============================================================
let mediaRecorder = null;
let recordedChunks = [];
let animating = false;

function pickMimeType() {
  const types = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/mp4',
  ];
  for (const t of types) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) {
      return t;
    }
  }
  return '';
}

async function startRecording() {
  try {
    if (typeof MediaRecorder === 'undefined') {
      setStatus('❌ متصفحك لا يدعم MediaRecorder. جرّب Chrome.', true);
      return;
    }
    if (typeof canvas.captureStream !== 'function') {
      setStatus('❌ متصفحك لا يدعم captureStream. جرّب Chrome.', true);
      return;
    }

    btnStart.disabled = true;
    btnDownload.style.display = 'none';
    preview.style.display = 'none';
    diagEl.style.display = 'none';
    setStatus('🎬 جاري التسجيل... لا تبدّل الصفحة');

    recordedChunks = [];

    const stream = canvas.captureStream(FPS);
    const mimeType = pickMimeType();

    console.log('[Video] Codec:', mimeType || '(default)');

    const options = {
      videoBitsPerSecond: 8000000,
    };
    if (mimeType) options.mimeType = mimeType;

    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onerror = e => {
      console.error('MediaRecorder error:', e);
      setStatus('❌ خطأ في التسجيل: ' + (e.error ? e.error.message : 'غير معروف'), true);
      btnStart.disabled = false;
    };

    mediaRecorder.onstop = () => {
      animating = false;
      if (recordedChunks.length === 0) {
        setStatus('❌ لم يُسجّل أي شيء. جرّب مرة أخرى.', true);
        btnStart.disabled = false;
        return;
      }
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      preview.src = url;
      preview.style.display = 'block';

      btnDownload.style.display = 'inline-block';
      btnDownload.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'football_booking.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      setStatus('✅ تم توليد الفيديو! اضغط "تحميل"');
      btnStart.disabled = false;
      btnStart.textContent = '🔁 إعادة التوليد';
    };

    mediaRecorder.start(100);
    animating = true;

    const startTime = performance.now();
    const totalDuration = SCENE_DURATION * SCENES.length;

    function loop(now) {
      if (!animating) return;
      const elapsed = (now - startTime) / 1000;

      if (elapsed >= totalDuration) {
        renderFrame(SCENES.length - 1, SCENE_DURATION - 0.01, SCENE_DURATION);
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        }, 250);
        return;
      }

      const sceneIdx = Math.min(SCENES.length - 1, Math.floor(elapsed / SCENE_DURATION));
      const t = elapsed - sceneIdx * SCENE_DURATION;

      renderFrame(sceneIdx, t, SCENE_DURATION);

      const remaining = Math.ceil(totalDuration - elapsed);
      setStatus(`🎬 التسجيل... (${remaining} ث) — المشهد ${sceneIdx + 1}/${SCENES.length}`);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

  } catch (err) {
    console.error(err);
    setStatus('❌ خطأ: ' + err.message, true);
    btnStart.disabled = false;
    animating = false;
  }
}

// ============================================================
// 🚀 التهيئة
// ============================================================
btnStart.addEventListener('click', startRecording);
btnDiag.addEventListener('click', runDiagnostics);

window.addEventListener('load', () => {
  bgGradient = makeBg();
  // ارسم إطار المعاينة
  renderFrame(0, 2.5, SCENE_DURATION);
  setStatus('✅ جاهز — اضغط "توليد الفيديو"');

  // فحص تلقائي
  if (typeof MediaRecorder === 'undefined' || typeof canvas.captureStream !== 'function') {
    setStatus('⚠️ متصفحك قد لا يدعم التسجيل. اضغط "فحص المتصفح".', true);
  }
});

// معالجة أي خطأ غير متوقع
window.addEventListener('error', e => {
  console.error('Global error:', e.error);
  setStatus('❌ خطأ: ' + e.message, true);
});
</script>
